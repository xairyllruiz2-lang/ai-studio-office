.bd{padding:0 12px 12px;font-size:14px}

.rp{white-space:pre-wrap;margin-top:8px;background:#0a1124;border-radius:10px;padding:10px;display:none;font-size:14px}
.ak{background:#d9a441!important;margin-left:8px}
.dr{background:#7a5cf0!important;margin-left:8px}
.sp{background:#1fb5a5!important;margin-left:8px}

#c3{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hint{max-width:1000px;margin:4px auto;padding:0 16px;color:var(--mute);font-size:13px}
#sheet{max-height:52vh}
</style>
</head>

function rs(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;ren.setSize(w,h,false);cam.aspect=w/h;if(VO)cam.setViewOffset(w,h,0,Math.round(h*VO),w,h);else cam.clearViewOffset();cam.updateProjectionMatrix()}
new ResizeObserver(rs).observe(stage);rs();upd();
function fly(x,y,z,r,t2,p2){G={x,y,z,r,t:t2,p:p2}}
function setVO(v){VO=v;rs()}
function focusDept(i){const q=RP[i];setVO(.2);fly(q.x,1.3,q.z,Math.max(9,Math.min(22,9.6/cam.aspect)),Math.atan2(-q.x,-q.z),1.0);window.scrollTo({top:0,behavior:"smooth"})}
function focusBrain(){setVO(.2);fly(0,2.4,0,Math.max(10,Math.min(24,10/cam.aspect)),th,.95)}
function overview(){setVO(0);fly(0,1.5,0,Math.min(56,Math.max(36,26/cam.aspect)),.6,1)}
function tick(ms){const t=ms/1000;
if(G){const k=.08;tg.x+=(G.x-tg.x)*k;tg.y+=(G.y-tg.y)*k;tg.z+=(G.z-tg.z)*k;rad+=(G.r-rad)*k;th+=Math.atan2(Math.sin(G.t-th),Math.cos(G.t-th))*k;ph+=(G.p-ph)*k;upd();if(Math.abs(G.r-rad)<.05&&Math.abs(G.x-tg.x)<.05&&Math.abs(G.z-tg.z)<.05)G=null}if(!calm){fx.forEach(f=>f(t));core.rotation.y=t*.6;core.position.y=2.7+Math.sin(t*1.4)*.12;wire.position.y=core.position.y;wire.rotation.y=-t*.4;rg.position.y=core.position.y;rg.rotation.x=1.2+Math.sin(t*.7)*.2;rg.rotation.y=t*.5;
chips.forEach((m,k)=>{const q=t*.5+k*2*Math.PI/chips.length;m.position.set(2.5*Math.cos(q),2.7+Math.sin(t+k)*.3,2.5*Math.sin(q));m.rotation.y=t})
pul.forEach(p=>{const u=(t*.12+p.o)%1;p.m.position.set(p.x*u,.18,p.z*u)});
works.forEach(w=>{const a=w.g.userData.arms;a[0].rotation.x=-.7+Math.sin(t*10+w.o)*.09;a[1].rotation.x=-.7+Math.cos(t*10+w.o*2)*.09})}
ren.render(sc3,cam);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
